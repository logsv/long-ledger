# User settings (answers Q9, 2026-11-14) and engine thresholds.

[portfolio]
max_stock_weight = 0.10
max_sector_weight = 0.25
max_precious_metals_weight = 0.15   # gold + silver ETFs together (default, change as you like)
max_small_cap_weight = 0.60         # small caps by value, using INDmoney's bucket (default)

[sell_triggers]
loss_threshold = 0.20              # loss of 20%+ ...
fundamentals_drop = 1.0            # ... AND fundamentals score fell by >= 1.0
fundamentals_lookback_days = 182   # compared with ~2 quarters ago
valuation_stretch = 0.30           # price > upper intrinsic value by 30%+

[governance]
pledge_veto_pct = 25.0             # promoter pledge above this vetoes BUY/ACCUMULATE
pledge_rise_veto_pts = 5.0         # pledge up by this many points in a year vetoes too
rpt_warn_pct = 10.0                # related-party transactions as % of revenue
rpt_bad_pct = 20.0
dilution_cagr_warn = 0.05          # shares outstanding 3y CAGR

[technicals]
index_symbol = "NIFTY 500"         # import its daily prices to enable relative strength
stagger_tranches = 3

[tax_view]
wait_window_days = 30              # suggest waiting if a lot turns long-term this soon

[market]
# Index series pulled from Kite (import with --index). Used for the market regime block.
broad_index = "NIFTY 500"
large_cap_index = "NIFTY 50"
volatility_index = "INDIA VIX"
sector_indices = ["NIFTY BANK", "NIFTY IT", "NIFTY AUTO", "NIFTY PHARMA", "NIFTY FMCG", "NIFTY METAL",
                  "NIFTY ENERGY", "NIFTY REALTY", "NIFTY INFRA", "NIFTY PSU BANK", "NIFTY FIN SERVICE",
                  "NIFTY MEDIA", "NIFTY CPSE", "NIFTY SMLCAP 100", "NIFTY MIDCAP 100"]
vix_lookback_days = 365

[monitor]
drawdown_flag = 0.25        # flag if 25%+ below the 52-week high
weak_rs_flag = -0.10        # flag if 6-month return trails the broad index by 10+ points
volume_spike = 2.0          # flag if 20-day volume is 2x the 100-day average

[research]
# /research reads only companies' own websites. Documents whose numbers pass
# `check-facts` (units, EPS = PAT/shares, ebit <= ebitda, % ranges, revenue jumps)
# are confirmed automatically. Set false to confirm every document yourself.
auto_confirm_checked = true

[verification]
# A pending fact is confirmed automatically when an independent second reading
# (fact-verifier agent, different website, value not shown to it) agrees within:
rel_tolerance = 0.01          # 1% of the value for amounts, EPS, days, shares
abs_tolerance = 0.01          # ... but never tighter than this
pct_points_tolerance = 0.1    # percentages: within 0.1 percentage points
                              # flags (auditor_qualified/resigned) must match exactly

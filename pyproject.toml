[project]
name = "india-stock-analyzer"
version = "0.6.2"
description = "Personal-use, analysis-only stock workspace for Indian equities (deterministic core for Claude Code)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
isa = "isa.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
